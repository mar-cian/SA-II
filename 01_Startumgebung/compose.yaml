name: hf-ops-lab
services:
  api:
    build: ./api
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
  web:
    build: ./web
    ports: ["127.0.0.1:8081:8000"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
  worker:
    build: ./worker
    environment:
      API_URL: http://api:8000
      JOB_PATH: ${JOB_PATH:-/jobz}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
